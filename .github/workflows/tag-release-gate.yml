name: Tag release gate

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: tag-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reuse-exact-main-ci:
    name: reuse exact main CI
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.ci.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve annotated or lightweight tag target
        id: target
        shell: bash
        run: |
          target_sha="$(git rev-list -n 1 "$GITHUB_REF")"
          test "$(git cat-file -t "$target_sha")" = commit
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Require exact successful main CI for target
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_tag_ci_reuse.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ steps.target.outputs.sha }}" \
            --workflow ci.yml \
            --current-run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

  create-draft-release:
    name: create draft release
    needs: reuse-exact-main-ci
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check draft generator
        run: python3 -m unittest discover -s test -p 'generate_release_draft_unit.py'
      - name: Create draft from verified tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.reuse-exact-main-ci.outputs.source_run_id }}
        run: |
          python3 scripts/generate_release_draft.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --sha "$(git rev-list -n 1 "$GITHUB_REF")" \
            --ci-run-id "$SOURCE_RUN_ID"

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

jobs:
  fast:
    name: fast (${{ matrix.os }}, Julia ${{ matrix.julia.label }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia:
          - version: '1.10'
            label: '1.10'
          - version: '1.13.0'
            label: '1.13.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia.version }}
      - uses: julia-actions/cache@v2
      - uses: ./.github/actions/julia-package-environment
      - name: Fast tests
        env:
          WANNIERNLQG_TEST_MODE: fast
          WANNIERNLQG_TEST_OUTPUT_ROOT: ${{ runner.temp }}/wanniernlqg-tests
        run: julia --project="$WANNIERNLQG_CI_PROJECT" -e 'using Pkg; Pkg.test("WannierNLQG"; julia_args=Cmd(["-L", ENV["WANNIERNLQG_CI_LOAD_PATH_BOOTSTRAP"]]))'

  full-shard:
    name: full-shard (${{ matrix.shard }})
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        shard:
          - interfaces-and-symmetry
          - wannier-core
          - scientific-contracts
          - thread-determinism
          - star-gauge-thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publication-environment
        if: matrix.shard == 'scientific-contracts'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: ./.github/actions/julia-package-environment
      - name: Full-only shard
        env:
          WANNIERNLQG_TEST_MODE: full-shard
          WANNIERNLQG_TEST_SHARD: ${{ matrix.shard }}
          WANNIERNLQG_TEST_OUTPUT_ROOT: ${{ runner.temp }}/wanniernlqg-tests
        run: julia --project="$WANNIERNLQG_CI_PROJECT" -e 'using Pkg; Pkg.test("WannierNLQG"; julia_args=Cmd(["-L", ENV["WANNIERNLQG_CI_LOAD_PATH_BOOTSTRAP"]]))'

  mpi-only:
    name: mpi-only
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: ./.github/actions/julia-package-environment
      - name: Install MPI launcher
        run: |
          julia --project="$WANNIERNLQG_CI_PROJECT" -e 'using MPI; MPI.install_mpiexecjl()'
      - name: Check read-only MPI resource observer
        run: python3 -B -m unittest discover -s test -p 'mpi_runner_resources_unit.py'
      - name: MPI-only tests
        env:
          WANNIERNLQG_TEST_MODE: mpi-only
          WANNIERNLQG_TEST_MPI_PROFILE: ci8
          WANNIERNLQG_TEST_OUTPUT_ROOT: ${{ runner.temp }}/wanniernlqg-tests
        run: |
          mpi_observer_owner_pid=$$
          python3 -B .github/scripts/mpi_runner_resources.py --owner-pid "$mpi_observer_owner_pid" --interval 30 --max-seconds 7200 &
          julia --project="$WANNIERNLQG_CI_PROJECT" -e 'using Pkg; Pkg.test("WannierNLQG"; julia_args=Cmd(["-L", ENV["WANNIERNLQG_CI_LOAD_PATH_BOOTSTRAP"]]))'

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [fast, full-shard, mpi-only]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compute job to succeed
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_SHARD_RESULT: ${{ needs.full-shard.result }}
          MPI_ONLY_RESULT: ${{ needs.mpi-only.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$FULL_SHARD_RESULT" = success
          test "$MPI_ONLY_RESULT" = success

name: Julia package environment
description: Resolve a Julia-version-compatible CI environment without rewriting the released lock
runs:
  using: composite
  steps:
    - name: Instantiate and precompile
      shell: bash
      env:
        JULIA_PKG_PRECOMPILE_AUTO: '0'
      run: |
        julia --project=. -e '
          using Pkg, TOML
          root = pwd()
          locked_path = joinpath(root, "Manifest.toml")
          locked_bytes = read(locked_path)
          project_bytes = read(joinpath(root, "Project.toml"))
          locked = TOML.parse(String(copy(locked_bytes)))
          locked_version = VersionNumber(locked["julia_version"])
          project = TOML.parse(String(copy(project_bytes)))
          consumer_deps = copy(project["deps"])
          consumer_compat = copy(project["compat"])
          # Catalog replay verifies the frozen generator package and C artifact.
          # Keep that closure on its released identities when resolving older Julia.
          generation_packages = ("Spglib", "spglib_jll")
          for name in generation_packages
              record = only(locked["deps"][name])
              version = VersionNumber(record["version"])
              consumer_deps[name] = record["uuid"]
              consumer_compat[name] = "=$(version.major).$(version.minor).$(version.patch)"
          end
          consumer = mktempdir(ENV["RUNNER_TEMP"]; prefix = "wanniernlqg-ci-", cleanup = false)
          open(joinpath(consumer, "Project.toml"), "w") do stream
              TOML.print(stream, Dict("deps" => consumer_deps, "compat" => consumer_compat))
          end
          if (VERSION.major, VERSION.minor) == (locked_version.major, locked_version.minor)
              cp(locked_path, joinpath(consumer, "Manifest.toml"))
          end
          Pkg.activate(consumer)
          Pkg.develop(Pkg.PackageSpec(path = root); preserve = Pkg.PRESERVE_ALL)
          Pkg.pin([Pkg.PackageSpec(name = name, version = VersionNumber(only(locked["deps"][name])["version"])) for name in generation_packages])
          Pkg.instantiate(; allow_autoprecomp = false)
          resolved = TOML.parsefile(joinpath(consumer, "Manifest.toml"))
          for name in generation_packages
              actual = only(resolved["deps"][name])
              expected = only(locked["deps"][name])
              for key in ("uuid", "version", "git-tree-sha1")
                  actual[key] == expected[key] || error("Catalog generation dependency changed: $(name) $(key)")
              end
              actual["pinned"] === true || error("Catalog generation dependency is not pinned: $(name)")
          end
          Pkg.precompile(; strict = true)
          read(locked_path) == locked_bytes || error("Released dependency lock changed in CI")
          read(joinpath(root, "Project.toml")) == project_bytes || error("Released project changed in CI")
          bootstrap = joinpath(consumer, "test_load_path.jl")
          open(bootstrap, "w") do stream
              # Pkg forwards -L to incremental compiler workers as well as tests.
              # Leave compiler startup untouched and avoid globals/closures in Main.
              println(stream, "if ccall(:jl_generating_output, Cint, ()) == 0")
              println(stream, "    let test_environments = String[]")
              println(stream, "        for path in LOAD_PATH")
              println(stream, "            if isabspath(path) && path != ", repr(consumer), " && isfile(joinpath(path, \"Project.toml\"))")
              println(stream, "                push!(test_environments, path)")
              println(stream, "            end")
              println(stream, "        end")
              println(stream, "        length(test_environments) == 1 || error(\"Expected the explicit Pkg.test sandbox environment\")")
              println(stream, "        test_environment = only(test_environments)")
              println(stream, "        empty!(LOAD_PATH)")
              println(stream, "        append!(LOAD_PATH, unique([test_environment, ", repr(consumer), ", \"@stdlib\"]))")
              println(stream, "        ENV[\"JULIA_LOAD_PATH\"] = join(LOAD_PATH, Sys.iswindows() ? Char(59) : Char(58))")
              println(stream, "    end")
              println(stream, "end")
          end
          open(ENV["GITHUB_ENV"], "a") do stream
              println(stream, "WANNIERNLQG_CI_PROJECT=", consumer)
              println(stream, "WANNIERNLQG_CI_LOAD_PATH_BOOTSTRAP=", bootstrap)
          end
        '
